<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拖拽小例子</title>
  <script type="module" crossorigin src="/index.js"></script>
  <link rel="stylesheet" crossorigin href="/style.css">
</head>
<body>
  <div class="main">
    <!-- 顶部工具栏 -->
    <header class="header">
      <div class="header-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        拖拽编辑器
      </div>
      <div class="header-actions">
        <button class="btn look" title="全屏预览">全屏预览</button>
        <button class="btn down">下载源码</button>
        <button class="btn danger clear">清除全部</button>
      </div>
    </header>
    <!-- 主体内容 -->
    <div class="editor-body">
      <!-- 组件库 -->
      <div id="left">
        <h3>组件库</h3>
        <div class="comp-card" draggable="true">
          <div class="comp-icon">T</div>
          <div><div class="comp-label">文本</div><div class="comp-desc">可编辑文本组件</div></div>
        </div>
        <div class="comp-card" draggable="true">
          <div class="comp-icon">B</div>
          <div><div class="comp-label">按钮</div><div class="comp-desc">可点击按钮组件</div></div>
        </div>
        <div class="comp-card" draggable="true">
          <div class="comp-icon">I</div>
          <div><div class="comp-label">输入框</div><div class="comp-desc">文本输入组件</div></div>
        </div>
        <div class="comp-card" draggable="true">
          <div class="comp-icon">IMG</div>
          <div><div class="comp-label">图片</div><div class="comp-desc">图片展示组件</div></div>
        </div>
        <div class="comp-card" draggable="true">
          <div class="comp-icon">TXT</div>
          <div><div class="comp-label">文本域</div><div class="comp-desc">多行文本组件</div></div>
        </div>
        <div class="comp-card" draggable="true">
          <div class="comp-icon">SEL</div>
          <div><div class="comp-label">下拉框</div><div class="comp-desc">下拉选择组件</div></div>
        </div>
        <div class="comp-card" draggable="true">
          <div class="comp-icon">CHK</div>
          <div><div class="comp-label">复选框</div><div class="comp-desc">多选组件</div></div>
        </div>
        <div class="comp-card" draggable="true">
          <div class="comp-icon">RDO</div>
          <div><div class="comp-label">单选框</div><div class="comp-desc">单选组件</div></div>
        </div>
        <div class="comp-card" draggable="true">
          <div class="comp-icon">RNG</div>
          <div><div class="comp-label">滑块</div><div class="comp-desc">范围选择组件</div></div>
        </div>
      </div>
      <!-- 画布区域 -->
      <div id="midden"></div>
      <!-- 属性面板 -->
      <div id="right">
        <h3>属性面板</h3>
        <label class="item">
          <span class="text">Width</span>
          <input class="inp" type="text">
        </label>
        <label class="item">
          <span class="text">Height</span>
          <input class="inp" type="text">
        </label>
        <label class="item">
          <span class="text">Top</span>
          <input class="inp" type="text">
        </label>
        <label class="item">
          <span class="text">Left</span>
          <input class="inp" type="text">
        </label>
        <label class="item">
          <span class="text">Text</span>
          <input class="inp" type="text">
        </label>
        <label class="item">
          <span class="text">Src</span>
          <input class="inp" type="text">
        </label>
        <label class="item">
          <span class="text">Color</span>
          <input class="inp" type="text">
        </label>
        <label class="item">
          <span class="text">Font Size</span>
          <input class="inp" type="text">
        </label>
      </div>
      <!-- 全屏预览 -->
      <div class="code"></div>
    </div>
  </div>
</body>
</html>
